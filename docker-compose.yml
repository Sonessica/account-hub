services:
  openbento-review:
    build: .
    container_name: account-hub
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: review-placeholder
      NEXT_PUBLIC_APP_URL: https://account.atchooo.com:2096
      ACCOUNT_HUB_DB_PATH: /app/data/account-hub.sqlite
      ACCOUNT_HUB_ADMIN_PASSWORD: ${ACCOUNT_HUB_ADMIN_PASSWORD:?Set ACCOUNT_HUB_ADMIN_PASSWORD in .env}
    volumes:
      - ./data:/app/data
    networks:
      - nas-frontend

networks:
  nas-frontend:
    external: true
