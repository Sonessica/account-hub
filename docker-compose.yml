services:
  account-hub:
    container_name: account-hub
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://account_hub:${POSTGRES_PASSWORD}@postgres:5432/account_hub
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${ACCOUNT_HUB_BIND_ADDRESS:-127.0.0.1}:3100:3000"
    networks:
      - default
      - nas-frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: account_hub
      POSTGRES_USER: account_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_hub -d account_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nas-frontend:
    external: true
